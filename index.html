<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>محول GPX وتسجيل المسارات - Full Screen GPS Tracker</title>
    
    <!-- رابط المانيفست الصحيح -->
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- JSZip & html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
        #map { z-index: 10; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white overflow-x-hidden">

    <!-- Top Navigation Bar -->
    <header id="main-header" class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-2.5 flex items-center justify-between flex-wrap gap-2">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-600 text-white flex items-center justify-center text-xl shadow-md">
                    <i class="fa-solid fa-route"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-900 leading-tight">محول ومسجل مسارات GPX</h1>
                    <p class="text-[11px] text-slate-500">تتبع حي GPS + تحويل بين GPX وروابط خرائط جوجل</p>
                </div>
            </div>

            <!-- Mode Switcher Tabs -->
            <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-xl text-xs font-semibold">
                <button id="nav-mode-converter" onclick="setAppMode('converter')" class="px-3 py-1.5 rounded-lg bg-white text-brand-600 shadow-sm transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-right-arrow-left text-rose-500"></i>
                    <span>التحويل والتعديل</span>
                </button>
                <button id="nav-mode-tracker" onclick="setAppMode('tracker')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition-all flex items-center gap-1.5 relative">
                    <span id="recording-badge-dot" class="hidden absolute -top-0.5 -right-0.5 w-2.5 h-2.5 bg-rose-500 rounded-full animate-ping"></span>
                    <i class="fa-solid fa-satellite-dish text-emerald-600"></i>
                    <span>تسجيل وتتبع الشاشة الكاملة</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <main class="flex-1 w-full relative flex flex-col">

        <!-- ================= MODE 1: CONVERTER & EDITOR ================= -->
        <div id="view-converter" class="max-w-7xl w-full mx-auto px-4 py-4 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-1">
            
            <!-- Controls Sidebar -->
            <div class="lg:col-span-5 xl:col-span-4 flex flex-col gap-4">
                
                <!-- Mode Sub-Tabs -->
                <div class="bg-slate-200/80 p-1 rounded-2xl flex text-xs font-semibold">
                    <button id="tab-gpx2gmaps" onclick="switchTab('gpx2gmaps')" class="flex-1 py-2 px-3 rounded-xl transition-all shadow-sm bg-white text-brand-600 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-file-export"></i>
                        <span>GPX ← جوجل ماب</span>
                    </button>
                    <button id="tab-gmaps2gpx" onclick="switchTab('gmaps2gpx')" class="flex-1 py-2 px-3 rounded-xl transition-all text-slate-600 hover:text-slate-900 flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-link"></i>
                        <span>جوجل ماب ← GPX</span>
                    </button>
                </div>

                <!-- GPX to GMaps Section -->
                <div id="section-gpx2gmaps" class="space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h2 class="text-xs font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-2">
                            <i class="fa-solid fa-file-lines text-brand-500"></i>
                            1. رفع ملف GPX
                        </h2>
                        <div id="drop-zone" class="border-2 border-dashed border-slate-300 hover:border-brand-500 bg-slate-50 rounded-xl p-4 text-center transition-all cursor-pointer">
                            <input type="file" id="gpx-file-input" accept=".gpx,application/gpx+xml" class="hidden" multiple>
                            <i class="fa-solid fa-cloud-arrow-up text-2xl text-slate-400 mb-1"></i>
                            <p class="text-xs font-semibold text-slate-700">اسحب ملف GPX أو اضغط للاختيار</p>
                        </div>
                        <div id="file-info" class="hidden p-2 bg-brand-50 border border-brand-200 rounded-xl flex items-center justify-between text-xs text-brand-900">
                            <span id="file-name" class="font-medium truncate">filename.gpx</span>
                            <button onclick="clearGPXFile()" class="text-slate-400 hover:text-rose-600 px-1"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>

                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h2 class="text-xs font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-2">
                            <i class="fa-solid fa-sliders text-brand-500"></i>
                            2. الإعدادات وتقليل النقاط
                        </h2>
                        <div class="space-y-1">
                            <label class="text-[11px] font-semibold text-slate-700">وسيلة التنقل:</label>
                            <select id="transport-mode" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl p-2 outline-none">
                                <option value="driving">🚗 قيادة السيارة (Driving)</option>
                                <option value="walking">🚶 مشي على الأقدام (Walking)</option>
                                <option value="bicycling">🚲 ركوب الدراجة (Bicycling)</option>
                            </select>
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between items-center text-xs">
                                <label class="font-semibold text-slate-700">عدد النقاط:</label>
                                <span id="sample-count-display" class="font-bold text-brand-600 bg-brand-50 px-2 py-0.5 rounded border border-brand-200">10 نقاط</span>
                            </div>
                            <input type="range" id="sample-slider" min="2" max="100" value="10" class="w-full accent-brand-600 h-1.5 bg-slate-200 rounded-lg cursor-pointer">
                        </div>
                    </div>
                </div>

                <!-- GMaps to GPX Section -->
                <div id="section-gmaps2gpx" class="hidden space-y-4">
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                        <h2 class="text-xs font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-2">
                            <i class="fa-solid fa-link text-brand-500"></i>
                            لصق رابط Google Maps
                        </h2>
                        <input type="text" id="gmaps-input" placeholder="الصق رابط google.com/maps/dir/... هنا" dir="ltr" class="w-full bg-slate-50 border border-slate-200 text-xs rounded-xl p-2.5 outline-none font-mono">
                        <button onclick="parseGmapsLink()" id="parse-gmaps-btn" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md">
                            <i class="fa-solid fa-magnifying-glass-location"></i>
                            <span>تحليل وتوليد المسار</span>
                        </button>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                    <button id="btn-export-gpx" onclick="exportGPX()" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-semibold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-sm">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>تصدير المسار المعدل (GPX)</span>
                    </button>
                    <button id="btn-open-gmaps" onclick="openRouteInGoogleMaps()" disabled class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-semibold py-2 px-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-sm">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        <span>فتح في تطبيق خرائط جوجل</span>
                    </button>
                </div>
            </div>

            <!-- Standard Map Preview Container -->
            <div class="lg:col-span-7 xl:col-span-8 flex flex-col gap-3 min-h-[450px]">
                <div class="bg-white p-2 rounded-2xl border border-slate-200 shadow-sm flex-1 flex flex-col relative">
                    <div id="map" class="w-full h-full min-h-[400px] rounded-xl bg-slate-100"></div>
                </div>
            </div>
        </div>

        <!-- ================= MODE 2: FULL-SCREEN GPS TRACKER ================= -->
        <div id="view-tracker" class="hidden absolute inset-0 z-40 bg-slate-950 flex flex-col">
            
            <!-- Hidden File Input for Loading GPX in Tracker -->
            <input type="file" id="tracker-gpx-input" accept=".gpx,application/gpx+xml" class="hidden" onchange="loadGPXInTracker(event)">

            <!-- Fullscreen Map Canvas -->
            <div id="map-tracker" class="w-full h-full absolute inset-0 z-0"></div>

            <!-- Floating Top Header Bar -->
            <div class="absolute top-3 inset-x-3 z-20 flex items-center justify-between pointer-events-none">
                <div class="glass-panel px-3 py-2 rounded-2xl shadow-lg flex items-center gap-2 pointer-events-auto">
                    <button onclick="setAppMode('converter')" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center text-xs transition-all">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span id="tracker-status-indicator" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                            <span id="tracker-status-text" class="text-xs font-bold text-slate-800">جاهز للتسجيل</span>
                        </div>
                        <p id="tracker-acc-text" class="text-[9px] text-slate-500">دقة GPS: -- م</p>
                    </div>
                </div>

                <!-- Floating Top Action Buttons (Load GPX & Settings) -->
                <div class="flex items-center gap-2 pointer-events-auto">
                    <!-- Button to load GPX directly inside Tracker -->
                    <button onclick="document.getElementById('tracker-gpx-input').click()" class="px-3 h-10 rounded-2xl glass-panel text-brand-600 font-bold text-xs shadow-lg flex items-center gap-1.5 hover:bg-white transition-all">
                        <i class="fa-solid fa-folder-open text-brand-600"></i>
                        <span>فتح GPX للتتبع</span>
                    </button>
                    <button onclick="toggleTrackerSettingsModal()" class="w-10 h-10 rounded-2xl glass-panel text-slate-800 shadow-lg flex items-center justify-center text-sm hover:bg-white transition-all">
                        <i class="fa-solid fa-gear"></i>
                    </button>
                </div>
            </div>

            <!-- Floating HUD Stats Bar (Dashboard Glass) -->
            <div class="absolute top-16 inset-x-3 z-20 pointer-events-none">
                <div class="glass-dark px-4 py-3 rounded-2xl shadow-2xl border border-white/10 grid grid-cols-4 gap-2 text-center text-white pointer-events-auto">
                    <div>
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">السرعة</p>
                        <p id="hud-speed" class="text-base font-extrabold text-emerald-400">0.0 <span class="text-[9px] text-slate-300 font-normal">كم/س</span></p>
                    </div>
                    <div class="border-r border-white/10">
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">المسافة</p>
                        <p id="hud-distance" class="text-base font-extrabold text-brand-400">0.00 <span class="text-[9px] text-slate-300 font-normal">كم</span></p>
                    </div>
                    <div class="border-r border-white/10">
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">الارتفاع</p>
                        <p id="hud-elevation" class="text-base font-extrabold text-amber-400">0 <span class="text-[9px] text-slate-300 font-normal">م</span></p>
                    </div>
                    <div class="border-r border-white/10">
                        <p class="text-[9px] text-slate-400 font-bold uppercase tracking-wider">الوقت</p>
                        <p id="hud-time" class="text-base font-extrabold text-purple-300 font-mono">00:00</p>
                    </div>
                </div>
            </div>

            <!-- Floating Bottom Primary Controls -->
            <div class="absolute bottom-6 inset-x-4 z-20 flex items-center justify-center gap-4 pointer-events-none">
                
                <!-- Rec / Stop Giant Button -->
                <button id="btn-toggle-record" onclick="toggleRecordState()" class="pointer-events-auto h-16 px-8 rounded-full bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black text-sm flex items-center justify-center gap-3 shadow-2xl shadow-emerald-500/40 active:scale-95 transition-all">
                    <i class="fa-solid fa-play text-lg"></i>
                    <span>بدء تسجيل الطريق</span>
                </button>

                <!-- Add Waypoint Button -->
                <button id="
